services:
  db:
    image: pgvector/pgvector:pg16
    container_name: obsidian_rag_db
    environment:
      POSTGRES_DB: obsidian_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obsidian_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
