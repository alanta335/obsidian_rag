spring:
  application:
    name: obsidian_rag
  config:
    # Loads ./.env (KEY=value) as a property source; [.properties] forces properties parsing.
    # Real environment variables still take precedence over .env values.
    import: "optional:file:.env[.properties]"

server:
  port: 8080

obsidian:
  rag:
    # Values resolve in this order: real environment variable > .env file > default.
    vault-path: ${OBSIDIAN_VAULT_PATH:}
    chunk-size: 1500
    chunk-overlap: 200
    state-file: ./data/index-state.json

    nvidia:
      api-key: ${NVIDIA_API_KEY:}
      base-url: https://integrate.api.nvidia.com/v1
      chat-model: nvidia/nemotron-3.5-lightning-30b-a3b
      embedding-model: nvidia/nemotron-3-embed-1b
      embedding-dimension: 2048
      batch-size: 16
      temperature: 0.2
      max-tokens: 4096

    retrieval:
      max-results: 6
      min-score: 0.55
      min-results: 1
      expand-linked-context: true
      linked-min-score: 0.30
      linked-max-notes: 3

    faithfulness:
      verify: true
      regenerate-if-unfaithful: true

    store:
      host: ${POSTGRES_HOST:localhost}
      port: ${POSTGRES_PORT:5433}
      database: ${POSTGRES_DB:obsidian_rag}
      user: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:postgres}
      table: obsidian_segments

logging:
  level:
    com.rag.obsidian_rag: INFO
